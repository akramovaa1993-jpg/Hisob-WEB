<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HISOB WEB — sinov V1.0</title>
<style>
:root{--green:#087a5a;--deep:#083e31;--ink:#15392e;--muted:#708a80;--bg:#f2f7f4;--border:#dce9e1;--light:#e9f6ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}
.shell{display:flex;min-height:100vh}.sidebar{width:230px;flex:none;background:white;border-right:1px solid var(--border);padding:24px 13px}.brand{display:flex;gap:11px;align-items:center;font-size:20px;font-weight:900;margin:0 11px 29px}.mark{display:grid;place-items:center;background:var(--green);color:white;width:41px;height:41px;border-radius:12px}.navbtn{display:block;width:100%;border:0;text-align:left;border-radius:11px;padding:13px 12px;color:#5c766b;background:none;margin:3px 0;cursor:pointer;font-weight:650}.navbtn.active{background:#e0f2e8;color:#006b4b}.navbtn:hover{background:#f0f7f3}main{flex:1;min-width:0;padding:28px;max-width:1700px}.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px;margin-bottom:23px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:1.3px;font-weight:900}.heading{font-size:28px;margin:5px 0}.muted{color:var(--muted);font-size:12px}.status{color:#78591a;background:#fff8e5;border:1px solid #f1e1ae;padding:10px 13px;border-radius:10px;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}.metric,.panel{background:white;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 6px 24px #154b2510}.metric span{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:clamp(21px,2vw,31px);margin:15px 0 5px;letter-spacing:-.6px}.metric small{color:var(--muted)}.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.secthead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.secthead h2{font-size:17px;margin:0}.badge{border-radius:8px;background:#eaf5ed;color:var(--green);padding:6px 9px;font-size:11px;font-weight:800}.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.plan{border-right:1px solid var(--border);padding-right:9px;min-width:0}.plan b{display:block;font-size:13px}.plan small{display:block;margin:12px 0;color:#668275;font-weight:700}.barrow{display:flex;align-items:center;gap:7px}.track{height:8px;background:#e6eeea;border-radius:100px;flex:1;min-width:12px;overflow:hidden}.fill{height:100%;background:var(--green);border-radius:100px}.pct{font-size:11px;font-weight:900;color:#006b4b}.codes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.code{border-radius:7px;background:#f3faf6;border:1px solid #d9e9e0;text-align:center;padding:9px 3px;font-size:11px;font-weight:850;color:#086848}.hint{padding:16px 0;color:#849e90;font-size:12px;line-height:1.7}.tablewrap{overflow-x:auto}.table{width:100%;border-collapse:collapse}.table th{text-align:left;background:#f6faf8;color:#6d897d;font-size:11px}.table th,.table td{border-bottom:1px solid var(--border);padding:12px 10px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{background:var(--green);color:white;border:1px solid var(--green);border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.btn.alt{color:var(--green);background:white;border-color:var(--border)}.range{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:17px}.range label{font-size:11px;color:#57766a;font-weight:700}.range input{display:block;margin-top:5px;padding:9px;border-radius:8px;border:1px solid var(--border);background:#fff}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.day{border-radius:13px;border:1px solid #d5ded9;background:linear-gradient(130deg,#fafafa,#dfe3e4);box-shadow:0 4px 8px #00000010;padding:13px 5px;cursor:pointer;color:#2d4245}.day.has{background:linear-gradient(130deg,#f0fff6,#bbe9d5);border-color:#aadcc2;color:#005640}.day small{display:block;font-family:Georgia,serif;font-size:10px;text-align:left;padding-left:6px}.day b{display:block;font:900 34px Georgia,serif;text-align:center;margin:3px}.day span{font:800 11px Georgia,serif;display:block;text-align:center}.graphic{height:230px;border-bottom:1px solid var(--border);display:flex;align-items:end;gap:8px;padding:10px 0 25px}.column{flex:1;position:relative;height:100%;display:flex;align-items:end;justify-content:center}.column i{width:55%;background:linear-gradient(0deg,#0a8f6c,#6ad5ae);border-radius:5px 5px 0 0;min-height:1px}.column span{position:absolute;bottom:-20px;font-size:10px;color:#6f8b80}.modalbg{position:fixed;inset:0;background:#102d2299;display:none;align-items:center;justify-content:center;padding:18px}.modalbg.open{display:flex}.modal{background:white;padding:24px;border-radius:16px;width:min(630px,100%);max-height:85vh;overflow:auto}.empty{padding:26px;color:var(--muted);text-align:center}.foot{margin-top:28px;color:var(--muted);font-size:11px}
@media(max-width:1150px){.plans{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:760px){.shell{display:block}.sidebar{width:auto;padding:11px;position:relative}.brand{margin:3px 5px 8px}.navigation{display:flex;overflow-x:auto}.navbtn{white-space:nowrap;width:auto;flex:none}main{padding:14px}.days{grid-template-columns:repeat(4,minmax(0,1fr))}.codes{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar"><div class="brand"><span class="mark">H</span> HISOB<span style="color:#15b27f">.</span></div><div class="navigation" id="nav"></div></aside>
<main><div class="top"><div><div class="eyebrow">HISOB · MUSTAQIL VEB-VERSIYA</div><h1 class="heading" id="heading">Dashboard</h1><div class="muted">Yangi platforma · mavjud HISOB tizimidan alohida</div></div><div class="status">SINOV · Google Sheets hali ulanmagan · ma'lumotlar namunaviy</div></div><div id="root"></div><p class="foot">HISOB WEB V1.0 · Xavfsiz UI prototip · mavjud HISOB_BAZA va Telegram botga ta'sir qilmaydi</p></main>
</div>
<div class="modalbg" id="modal"><div class="modal"><div class="secthead"><h2 id="modalTitle">Kunlik prixod</h2><button class="btn alt" id="closeModal">Yopish ×</button></div><div id="modalBody"></div></div></div>
<script>
'use strict';
const navItems=[['dashboard','▦ Dashboard'],['correction','⚒ Korektrofka'],['products','▤ Mahsulotlar'],['projects','▣ Loyihalar'],['daily','↧ Kunlik kirimlar'],['receipts','▥ Prixod ro‘yxati'],['warehouse','▦ Sklad'],['reports','▧ Hisobotlar'],['users','♙ Foydalanuvchilar']];
const plans=[['MK24',522.9,88.9],['CA41',356,33.3],['CA46',1223.9,26.1],['CA431',393.8,34.4],['CA415',414.5,30.4],['KL30',215.6,57.4],['KL17',457.5,36.8],['KL27',332.3,50],['KL38',8083.1,31.5]];
const done=['CKL-51','CKL-13','MK77','MK43','KL37','CA48','KL9','CA171','KL35+CA195','MK129','MK194','MK192','MK161','MK199','MK159','MK193','CKR1','MK196'];
const samples={'2026-10-13':[['MK24','P60',1961]],'2026-10-15':[['CA41','P283',11817.7]],'2026-10-16':[['KL30','P102',13228.3]],'2026-10-17':[['CA431','P203',13220]],'2026-10-20':[['KL17','P59',1500.5]],'2026-10-21':[['CA46','P83',9600]],'2026-10-22':[['CA415','P41',14500]],'2026-10-23':[['KL27','P39',5730]],'2026-10-24':[['KL38','P79',10780]]};
const fmt=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:1});
const root=document.getElementById('root');let current='dashboard';
function panel(title,body,n=''){return '<section class="panel"><div class="secthead"><h2>'+title+'</h2>'+(n?'<span class="badge">'+n+'</span>':'')+'</div>'+body+'</section>'}
function dashboard(){return '<div class="metrics">'+[['Umumiy reja','141 992,4','kg'],['Jami kirim','129 992,8','kg'],['Rejadan qolgan','11 999,6','kg'],['Reja bajarilishi','91,5%','kg bo‘yicha']].map(v=>'<div class="metric"><span>'+v[0]+'</span><strong>'+v[1]+'</strong><small>'+v[2]+'</small></div>').join('')+'</div><div class="cols">'+panel('Plan','<div class="plans">'+plans.map(p=>'<div class="plan"><b>'+p[0]+'</b><small>'+fmt(p[1])+' kg qoldiq</small><div class="barrow"><div class="track"><div class="fill" style="width:'+p[2]+'%"></div></div><span class="pct">'+fmt(p[2])+'%</span></div></div>').join('')+'</div>','9 loyiha')+panel('To‘liq qabul qilindi','<div class="codes">'+done.map(x=>'<span class="code">'+x+'</span>').join('')+'</div>','18 loyiha')+'</div>'}
function correction(){return panel('Korektrofka ro‘yxati','<div class="codes"><div class="code" style="grid-column:span 2;padding:16px">KL30/CA41<br><br>Kolonna · KL30 · 10 797,9 kg<br><br>Lotok · CA41 · 1 221,5 kg<br><br>GPX · 12 019,4 kg</div></div><p class="hint">Yangi korrektrofkalarni qo‘shish va tahrirlash Google Sheets ulanishidan keyin yoqiladi.</p>')}
function table(title,heads,rows){return panel(title,'<div class="tablewrap"><table class="table"><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>')}
function projects(){return table('Loyihalar',['Loyiha','Holat','Qoldiq kg','Bajarilish'],plans.map(p=>[p[0],'Jarayonda',fmt(p[1]),fmt(p[2])+'%']).concat(done.slice(0,5).map(p=>[p,'Bajarilgan','0','100%'])))}
function daily(){return '<div class="range"><label>Sanadan<input id="from" type="date" value="2026-10-13"></label><label>Sanagacha<input id="to" type="date" value="2026-10-24"></label><button class="btn" id="filter">Qo‘llash</button></div><div id="dailyView"></div>'}
function dailyContent(){const from=document.getElementById('from').value,to=document.getElementById('to').value;if(!from||!to||from>to){document.getElementById('dailyView').innerHTML=panel('Sana oralig‘i','<p class="hint">To‘g‘ri sana oralig‘ini tanlang.</p>');return}const days=[];for(let dt=new Date(from+'T12:00:00'),end=new Date(to+'T12:00:00');dt<=end && days.length<366;dt.setDate(dt.getDate()+1))days.push(dt.toISOString().slice(0,10));const vals=days.map(d=>(samples[d]||[]).reduce((s,x)=>s+x[2],0)),max=Math.max(1,...vals);const chart='<div class="graphic">'+days.map((d,i)=>'<div class="column"><i title="'+d+' · '+fmt(vals[i])+' kg" style="height:'+(vals[i]/max*90)+'%"></i><span>'+d.slice(8)+'</span></div>').join('')+'</div>';const cards='<div class="days">'+days.map((d,i)=>{const p=d.split('-');return '<button class="day '+(vals[i]?'has':'')+'" data-date="'+d+'"><small>'+p[0]+'</small><b>'+Number(p[2])+'</b><span>'+(['','YANVAR','FEVRAL','MART','APREL','MAY','IYUN','IYUL','AVGUST','SENTYABR','OKTYABR','NOYABR','DEKABR'][Number(p[1])])+'</span></button>'}).join('')+'</div>';document.getElementById('dailyView').innerHTML=panel('Kunlik prixod diagrammasi · '+fmt(vals.reduce((a,b)=>a+b,0))+' kg',chart)+ '<div style="height:16px"></div>'+panel('Kunlik prixodlar kalendari',cards);}
function openDay(d){const items=samples[d]||[];if(!items.length)return;document.getElementById('modalTitle').textContent=d+' — kunlik kirim';document.getElementById('modalBody').innerHTML='<p class="muted">Sinov yozuvlari · faqat ko‘rish</p>'+items.map(x=>'<div class="metric"><strong style="font-size:18px">'+x[0]+' · '+x[1]+'</strong><span>'+fmt(x[2])+' kg</span></div>').join('')+'<p><button class="btn alt" id="exportDay">Excel / CSV olish</button></p>';document.getElementById('modal').classList.add('open');document.getElementById('exportDay').onclick=()=>{const csv='Loyiha,Mahsulot,Kg\n'+items.map(x=>x.join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='prixod-'+d+'.csv';a.click();URL.revokeObjectURL(url)}}
const placeholders={products:['Mahsulotlar','Mahsulot kodi','Loyiha','Reja'],receipts:['Prixod ro‘yxati','Sana','Loyiha','Kirim kg'],warehouse:['Sklad','Sklad','Prixod','Rasxod'],reports:['Hisobotlar','Hisobot','Davr','Jami'],users:['Foydalanuvchilar','Foydalanuvchi','Ruxsat','Holat']};
function render(page){current=page;const item=navItems.find(x=>x[0]===page);document.getElementById('heading').textContent=item?item[1].replace(/^[^ ]+ /,''):'Dashboard';document.getElementById('nav').innerHTML=navItems.map(([id,text])=>'<button class="navbtn '+(id===page?'active':'')+'" data-page="'+id+'">'+text+'</button>').join('');root.innerHTML=page==='dashboard'?dashboard():page==='correction'?correction():page==='projects'?projects():page==='daily'?daily():table(placeholders[page][0],placeholders[page].slice(1),[['—','—','—']])+'<p class="hint">Bo‘lim interfeysi tayyorlanmoqda. Hozircha haqiqiy ma’lumot va saqlash yoqilmagan.</p>';if(page==='daily')dailyContent()}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){render(nav.dataset.page);return}if(e.target.id==='filter')dailyContent();const day=e.target.closest('[data-date]');if(day)openDay(day.dataset.date)});
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.classList.remove('open')});render('dashboard');
</script>
</body></html>
