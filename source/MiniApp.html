const title=s=>`<div class="floating-top"><div class="path">UMBRELLA / HISOB</div><h1 class="page-h">${s}</h1></div>`;
function statCards(){const t=state.db.totals;const ks=[['plan','Umumiy reja',t.plan,nf(t.planKg,1)+' kg','plan',''],['truck','Jami kirim',t.got,nf(t.gotKg,1)+' kg','receipt','blue'],['package','Qoldiq',t.remaining,nf(t.remainingKg,1)+' kg','remain','gold'],['chart','Bajarilish',nf(t.percent,1)+'%',state.db.projects.length+' ta loyiha','total','violet']];return `<div class="kpi-grid">${ks.map(([icon,n,v,sub,kind,tone])=>`<button class="kpi" data-action="to-report" data-kind="${kind}" data-tone="${tone}"><div class="kpi-top"><span class="kpi-icon">${ic(icon)}</span><span>${n}</span></div><strong>${typeof v==='number'?nf(v):v}</strong><small>${esc(sub)}</small><span class="kpi-caret">${ic('chevron')}</span></button>`).join('')}</div>`;}
function getProject(name){return state.db.projects.find(p=>p.project===name)}
function projProduct(name){return state.db.products.filter(p=>p.project===name)}
function productTable(name){const a=projProduct(name);return `<div class="product-list"><div class="prod-head"><span>Mahsulot</span><span>Reja</span><span>Kirim</span><span>Qoldiq</span></div>${a.map(p=>`<div class="prod-row"><span><b>${esc(p.code)}</b><small>${esc(p.profile)}</small></span><span>${nf(p.plan)}</span><span class="text-strong">${nf(p.received)}</span><span>${nf(p.remaining)}</span></div>`).join('')||'<div class="empty">Mahsulot topilmadi</div>'}<div class="product-list-footer"><button class="minibtn secondary" data-action="open-detail" data-project="${esc(name)}">${ic('layers')} Batafsil ko‘rish ${ic('chevron')}</button></div></div>`}
function projectRows(limit){const a=limit?state.db.projects.slice(0,limit):state.db.projects;return a.map(p=>{const open=state.openProjects.has(p.project),v=p.plan?100*p.received/p.plan:0;return `<div class="project-row ${open?'expanded':''}"><button class="project-click" data-action="expand" data-project="${esc(p.project)}" aria-expanded="${open}"><div><div class="proj-name">${esc(p.project)}</div><div class="proj-sub">${nf(p.positions)} ta pozitsiya · ${nf(p.planKg,1)} kg reja</div></div><div class="right"><b>${nf(v,1)}%</b><div class="subtle" style="font-size:10px">${nf(p.received)} / ${nf(p.plan)} dona</div></div>${ic('chevron').replace('class="ic"','class="ic chev"')}</button><div class="progress"><span style="width:${pct(v)}%"></span></div>${open?productTable(p.project):''}</div>`}).join('')||'<div class="empty">Loyihalar mavjud emas</div>'}
function menuTiles(){const w=isOp();const data=[['plan','Plan','Reja va loyihalar','plan'],['receipt','Prixod','Kirim hisobotlari','reports'],['remain','Qoldiq','Qolgan mahsulotlar','reports'],['total','Jami','Umumiy hisobot','reports']];return `<div class="quick-grid">${data.map(([k,n,sub,page])=>`<button class="quick" data-action="quick" data-kind="${k}" data-page-next="${page}">${ic(k==='receipt'?'package':k==='remain'?'layers':k==='total'?'chart':'plan')}<span>${n}</span></button>`).join('')}</div><div class="section"><div class="section-title"><h2>ASOSIY AMALLAR</h2></div><div class="action-list"><button class="action-tile" data-page="reports">${ic('chart')}<span><b>Hisobotlar</b><small>Excel va ma’lumotlar</small></span>${ic('chevron')}</button><button class="action-tile" data-page="projects">${ic('layers')}<span><b>Loyihalar</b><small>Reja va kirimlar</small></span>${ic('chevron')}</button><button class="action-tile" data-page="profile">${ic('user')}<span><b>Profil</b><small>Shaxsiy ruxsatlar</small></span>${ic('chevron')}</button><button class="action-tile" data-page="daily">${ic('clock')}<span><b>Kunlik kirim</b><small>Oxirgi 30 kun</small></span>${ic('chevron')}</button>${w?`<button class="action-tile" data-page="add">${ic('truck')}<span><b>Prixod kiritish</b><small>Mahsulot qabul qilish</small></span>${ic('chevron')}</button><button class="action-tile" data-page="undo">${ic('undo')}<span><b>Qaytarish</b><small>Prixodni qaytarish</small></span>${ic('chevron')}</button>`:''}</div></div>`}
function operatorCard(){if(!(initData||miniSession)||!state.db)return '';
const u=state.db.user;
if(isOp())return `<div class="operator"><div class="avatar">${ic('shield')}</div><div class="operator-body"><b>Operator: ${esc(person())}</b><small>Amallar ismingiz va Telegram ID bilan qayd etiladi.</small></div><button class="chip" data-action="operator-logout">Chiqish</button></div>`;
if(u.role!=='operator')return `<div class="operator"><div class="avatar">${ic('lock')}</div><div class="operator-body"><b>Hisobot ko‘ruvchi</b><small>Prixod uchun administrator operator ruxsati berishi kerak.</small></div></div>`;
return `<div class="panel" style="margin-top:13px"><div class="row"><span class="avatar">${ic('lock')}</span><div><b>Operator kirishi</b><div class="hint">${u.needsPassword?'Birinchi marta shaxsiy parol o‘rnating':'Shaxsiy parol bilan kirib, Prixod huquqini faollashtiring'}</div></div></div><div class="field"><label>${u.needsPassword?'Yangi operator paroli':'Operator paroli'}</label><input id="operatorPasswordV11" class="input" type="password" minlength="12" autocomplete="${u.needsPassword?'new-password':'current-password'}" placeholder="Kamida 12 belgi"/></div><button class="btn full" data-action="operator-auth">${ic('lock')} ${u.needsPassword?'Parolni o‘rnatish':'Operator sifatida kirish'}</button></div>`;
}
function hero(variant='home'){const isHome=variant==='home';return `<section class="hero"><div class="hero-graph" aria-hidden="true"><span style="--h:30%"></span><span style="--h:54%"></span><span style="--h:72%"></span><span style="--h:97%"></span></div><div class="kicker">${isHome?'H I S O B · B O S H Q A R U V':'H I S O B O T · M A R K A Z I'}</div><h1>${isHome?'Xush kelibsiz!':'To‘liq hisobotlar'}</h1><p>${isHome?'Reja, kirim va qoldiq — barcha ma’lumotlar bir joyda.':'Loyihalarni ko‘ring, mahsulotlarni oching va Excel hisobotni botga yuboring.'}</p>${isHome?`<div class="usergreet">${ic('user')} Salom, ${esc(person())}</div>`:''}</section>`}
function home(){return hero()+statCards()+operatorCard()+`<section class="section"><div class="section-title"><h2>TEZKOR BO‘LIMLAR</h2><span class="eyebrow">LIVE DATA</span></div>${menuTiles()}</section><section class="section"><div class="section-title"><h2>Loyihalar</h2><button class="minibtn secondary" data-page="projects">Barchasi ${ic('chevron')}</button></div>${projectRows(4)}</section>`+recent();}
function recent(){const arr=(state.db.recent||[]).slice(0,6);return `<section class="section"><div class="section-title"><h2>Oxirgi kirimlar</h2></div><div class="panel">${arr.length?arr.map(x=>`<div class="listrow"><div><b>${esc(x.project)} · ${esc(x.code)}</b><small>${esc(x.date)} · ${nf(Math.abs(x.kg),1)} kg</small></div><b style="color:${x.qty>=0?'#66eec1':'#ff9baa'}">${x.qty>0?'+':''}${nf(x.qty)} dona</b></div>`).join(''):'<div class="empty">Oxirgi kirimlar mavjud emas</div>'}</div></section>`}
function projects(){return title('Loyihalar')+`<div class="panel"><div class="row between"><b>${state.db.projects.length} ta loyiha</b><span class="qa-pill">Google Sheets · jonli</span></div><p class="hint">Loyiha ustiga bosing — mahsulotlar ro‘yxati ochiladi.</p></div><section class="section">${projectRows()}</section>`}
function detail(){const p=getProject(state.detailProject);if(!p)return projects();const keys=['plan','receipt','remain'];const n={plan:'Reja',receipt:'Prixod',remain:'Qoldiq'};return `<button class="page-back" data-page="projects">${ic('back')} Loyihalar ro‘yxatiga qaytish</button>${title(esc(p.project))}${statCardsForProject(p)}<section class="section"><div class="mini-tabs">${keys.map(k=>`<button class="${state.detailTab===k?'active':''}" data-action="tab-detail" data-tab="${k}">${n[k]}</button>`).join('')}</div></section><section class="section"><div class="panel"><div class="section-title"><h2>${n[state.detailTab]} · ${esc(p.project)}</h2><span class="badge">${p.positions} pozitsiya</span></div><div class="prod-head"><span>Mahsulot</span><span>Reja</span><span>Kirim</span><span>Qoldiq</span></div>${projProduct(p.project).map(x=>`<div class="prod-row"><span><b>${esc(x.code)}</b><small>${esc(x.profile)}</small></span><span>${nf(x.plan)}</span><span class="text-strong">${nf(x.received)}</span><span>${nf(x.remaining)}</span></div>`).join('')}</div></section><p class="hint">Eslatma: vaqt va operator tafsilotlari mavjud Mini App API’da berilmagan. Shuning uchun bu oynada taxminiy vaqt yoki xodim ismi chiqarilmaydi.</p>`}
function statCardsForProject(p){const arr=[['plan','Reja',p.plan,nf(p.planKg,1)+' kg'],['truck','Kirim',p.received,nf(p.receivedKg,1)+' kg'],['package','Qoldiq',p.plan-p.received,nf(p.planKg-p.receivedKg,1)+' kg']];return `<div class="kpi-grid">${arr.map(([k,n,v,kg])=>`<button class="kpi" data-action="tab-detail" data-tab="${n==='Reja'?'plan':n==='Kirim'?'receipt':'remain'}"><div class="kpi-top"><span class="kpi-icon">${ic(k)}</span>${n}</div><strong>${nf(v)}</strong><small>${kg}</small></button>`).join('')}</div>`}
function reports(){const n={plan:'Plan',receipt:'Prixod',remain:'Qoldiq',total:'Jami'};const filtered=state.reportProject==='ALL'?state.db.projects:state.db.projects.filter(x=>x.project===state.reportProject);return hero('reports')+statCards()+`<div class="section panel"><div class="section-title"><h2>Hisobot sozlamalari</h2></div><div class="field"><label>Hisobot turi</label><div class="selector">${Object.entries(n).map(([k,v])=>`<button data-action="kind" data-kind="${k}" class="${state.reportKind===k?'active':''}">${v}</button>`).join('')}</div></div><div class="field"><label>Loyiha</label><select id="reportProject" class="input"><option value="ALL">Barcha loyihalar</option>${state.db.projects.map(p=>`<option value="${esc(p.project)}" ${state.reportProject===p.project?'selected':''}>${esc(p.project)}</option>`).join('')}</select></div><button class="btn full" data-action="report">${ic('download')} Excelni Telegramga yuborish</button><p class="hint">Excel UMBRELLA botidagi o‘z chatingizga yuboriladi.</p></div>${notice()}<section class="section"><div class="section-title"><h2>LOYIHALAR RO‘YXATI</h2><span class="subtle">${filtered.length} ta loyiha</span></div>${filtered.map(p=>{const open=state.openProjects.has(p.project);return `<div class="project-row ${open?'expanded':''}"><button class="project-click" data-action="expand" data-project="${esc(p.project)}" aria-expanded="${open}"><div><div class="proj-name">${esc(p.project)}</div><div class="proj-sub">Reja ${nf(p.plan)} · Kirim ${nf(p.received)} · Qoldiq ${nf(p.plan-p.received)}</div></div><div class="right"><b>${nf(p.plan?100*p.received/p.plan:0,1)}%</b><div class="subtle" style="font-size:10px">${nf(p.receivedKg,1)} kg kirim</div></div>${ic('chevron').replace('class="ic"','class="ic chev"')}</button>${open?productTable(p.project):''}</div>`}).join('')}</section>`}
function notice(){return state.notice?`<div class="notice ${state.noticeType==='error'?'error':''}" role="status">${esc(state.notice)}</div>`:''}
function receipt(){const isUndo=state.page==='undo';return title(isUndo?'Prixodni qaytarish':'Prixod kiritish')+`<div class="panel"><div class="row"><span class="avatar">${ic(isUndo?'undo':'truck')}</span><div><b>${isUndo?'Oldingi kirimni qaytarish':'Mahsulot qabul qilish'}</b><div class="hint">Barcha amallar operator nomidan jurnalga yoziladi.</div></div></div><div class="field"><label>Har qatorda LOYIHA KOD MIQDOR</label><textarea id="lines" class="input" placeholder="CKL-17 P283 1&#10;CKL-17 P809 2" spellcheck="false"></textarea></div><div class="notice" style="opacity:.8">Namuna: CKL-17 P283 1<br>Bir qatorda xato bo‘lsa, hech biri saqlanmaydi.</div><button class="btn full ${isUndo?'warning':''}" id="submit" data-action="receipt">${ic(isUndo?'undo':'check')} ${isUndo?'Qaytarishni tasdiqlash':'Prixodni saqlash'}</button></div>${notice()}`}
function plan(){return title('Plan qo‘shish')+`<div class="panel"><div class="row"><span class="avatar">${ic('file')}</span><div><b>Excel orqali reja qo‘shish</b><div class="hint">Yangi loyiha rejasini .xlsx fayl bilan yuklang.</div></div></div><p class="hint">Tugmani bosing. UMBRELLA bot chatida hujjat qabul qilish rejimi ishga tushadi.</p><button class="btn full" data-action="plan">${ic('arrow')} Telegram chatidan Excel yuborish</button></div>${notice()}`}
function chart(){const d=state.db.daily||[],max=Math.max(1,...d.map(x=>Math.max(x.positive,x.returned)));return `<div class="panel"><div class="row between"><h3 class="panel-title">30 kunlik kirimlar</h3><div class="legend"><span><i></i>Qabul</span><span><i class="back"></i>Qaytarish</span></div></div><div class="chart">${d.map((x,i)=>`<div class="chart-col"><div class="chart-bars"><span style="height:${Math.max(1,x.positive/max*100)}%"></span><span class="back" style="height:${Math.max(1,x.returned/max*100)}%"></span></div><span class="chart-date">${i%5===0||i===29?esc(x.date.slice(8)):''}</span></div>`).join('')}</div></div>`}
function daily(){const d=state.db.daily||[];return title('Kunlik kirimlar')+`<div class="kpi-grid"><div class="kpi"><div class="kpi-top">Qabul — 30 kun</div><strong>${nf(d.reduce((s,x)=>s+x.positive,0))}</strong><small>dona</small></div><div class="kpi" data-tone="gold"><div class="kpi-top">Qaytarish — 30 kun</div><strong>${nf(d.reduce((s,x)=>s+x.returned,0))}</strong><small>dona</small></div></div><section class="section">${chart()}</section><section class="section"><div class="section-title"><h2>KUNLAR BO‘YICHA</h2></div>${d.filter(x=>x.positive||x.returned).reverse().map(x=>`<div class="project-row ${state.dailyOpen.has(x.date)?'expanded':''}"><button class="project-click" data-action="daily-expand" data-date="${esc(x.date)}"><div><b>${esc(x.date)}</b><div class="proj-sub">Kirim ${nf(x.positive)} · qaytarish ${nf(x.returned)}</div></div>${ic('chevron').replace('class="ic"','class="ic chev"')}</button>${state.dailyOpen.has(x.date)?`<div class="product-list"><div class="statsline"><span>Qabul: ${nf(x.positive)} dona</span><span>${nf(x.positiveKg,1)} kg</span></div><div class="statsline"><span>Qaytarish: ${nf(x.returned)} dona</span><span>${nf(x.returnedKg,1)} kg</span></div><p class="hint">Kunlik umumiy ko‘rsatkichlar. Batafsil Excel uchun Hisobot bo‘limidan foydalaning.</p></div>`:''}</div>`).join('')||'<div class="empty">Oxirgi 30 kunda kirim yo‘q</div>'}</section>`}

function passwordSecurityPanel(){
  const adminOnly=!(initData||miniSession);
  const eligible=adminOnly?!!adminSession:!!(state.db&&state.db.user&&state.db.user.role==='operator');
  if(!eligible)return '';
  return `<section class="section"><div class="panel"><h3 class="panel-title">${ic('lock')} Xavfsizlik — Parolni almashtirish</h3>
    <p class="hint">${adminOnly?'Admin panel paroli':'Operator paroli'}ni almashtirish uchun joriy parol kerak.</p>
    <div class="field"><label>Joriy parol</label><input class="input" type="password" id="securityCurrent" autocomplete="current-password" /></div>
    <div class="field"><label>Yangi parol (12–128 belgi)</label><input class="input" type="password" id="securityNew" minlength="12" maxlength="128" autocomplete="new-password" /></div>
    <div class="field"><label>Yangi parolni tasdiqlang</label><input class="input" type="password" id="securityConfirm" minlength="12" maxlength="128" autocomplete="new-password" /></div>
    <div id="securityStatus" role="alert" class="hint" aria-live="polite" style="margin:8px 0"></div>
    <button class="btn full secondary" data-action="password-change">${ic('shield')} Parolni almashtirish</button></div></section>`;
}
async function changeProfilePassword(){
  const status=$('#securityStatus'), button=$('[data-action="password-change"]');
  const message=(text,bad=true)=>{if(status){status.textContent=String(text);status.style.color=bad?'#ffb6bd':'#86ffd5';}else alert(text);};
  const old=$('#securityCurrent')?.value||'',next=$('#securityNew')?.value||'',confirmPass=$('#securityConfirm')?.value||'';
  if(!old){message('Joriy parolni kiriting.');return;}
  if(next.length<12||next.length>128){message('Yangi parol 12–128 belgidan iborat bo‘lsin.');return;}
  if(next!==confirmPass){message('Yangi parollar bir xil emas.');return;}
  if(next===old){message('Yangi parol eskisidan farq qilishi kerak.');return;}
  const telegramMode=Boolean(initData||miniSession);
  if(telegramMode&&!initData){message('Telegram identifikatsiyasi mavjud emas. Botdagi «Ilovani ochish» tugmasidan kiring.');return;}
  const name=telegramMode?'miniOperatorChangePasswordV156':'miniAdminChangePasswordV156';
  if(button)button.disabled=true;
  message('Parol tekshirilmoqda…',false);
  try{
    // api() har rejimning kerakli ma'lumotini birinchi argument sifatida yuboradi.
    const r=await api(name,old,next);
    if(!r||!r.ok)throw Error(r?.message||'Server parol o‘zgarganini tasdiqlamadi.');
    if(!telegramMode){
      adminSession='';state.db=null;$('#nav').style.display='none';
      alert('Admin paroli yangilandi. Yangi parol bilan qayta kiring.');
      window.location.reload();return;
    }
    if($('#securityCurrent'))$('#securityCurrent').value='';
    if($('#securityNew'))$('#securityNew').value='';
    if($('#securityConfirm'))$('#securityConfirm').value='';
    message('Operator paroli muvaffaqiyatli yangilandi.',false);
  }catch(e){message(e?.message||String(e));}
  finally{if(button)button.disabled=false;}
}

function profile(){return title('Mening profilim')+`<div class="panel"><div class="row"><span class="avatar">${ic('user')}</span><div><b>${esc(person())}</b><div class="hint">HISOB foydalanuvchisi</div></div></div><div class="listrow"><span>Huquq</span><b>${state.db.user.role==='operator'?'Operator':state.db.user.role==='administrator'?'Administrator':'Faqat hisobot'}</b></div><div class="listrow"><span>Prixod huquqi</span><b>${isOp()?'Faol':'Cheklangan'}</b></div><p class="hint">Ruxsatlar admin panel orqali boshqariladi.</p></div><div class="section">${operatorCard()}</div>${passwordSecurityPanel()}`}
function renderNav(){const items=[['home','Asosiy','menu'],['projects','Loyihalar','layers'],['add','Prixod','truck'],['reports','Hisobot','chart'],['profile','Profil','user']];const el=$('#nav');el.innerHTML=items.filter(x=>x[0]!=='add'||isOp()).map(([p,n,k])=>`<button data-page="${p}" class="${state.page===p||(state.page==='project'&&p==='projects')?'active':''}" aria-label="${n}">${ic(k)}<span>${n}</span></button>`).join('')}
function render(){if(state.loading){$('#main').innerHTML='<div class="loading"><div class="spinner"></div>HISOB ma’lumotlari yuklanmoqda…</div>';return;}if(!state.db)return;if(!isOp()&&['add','undo','plan'].includes(state.page))state.page='home';renderNav();const screen={home,projects,project:detail,reports,add:receipt,undo:receipt,plan,daily,profile}[state.page]||home;$('#main').innerHTML=screen()}
function setPage(p){if(!isOp()&&['add','undo','plan'].includes(p)){state.notice='Bu amal uchun operator paroli bilan kirish kerak.';state.noticeType='error';state.page='profile'}else{state.page=p;state.notice=''}render();try{scrollTo({top:0,behavior:'instant'})}catch(_e){}}
function info(s,type=''){state.notice=String(s);state.noticeType=type;render();}
async function load(){state.loading=true;render();try{state.db=await api('miniLoadV10');state.loading=false;render()}catch(e){state.loading=false;$('#main').innerHTML=`<div class="panel" style="margin-top:50px"><h2>Ulanish xatosi</h2><p class="hint">${esc(e.message||String(e))}</p><button class="btn full" id="retry">Qayta urinish</button></div>`}}
async function operatorLogin(){if(!(initData||miniSession))return;const v=$('#operatorPasswordV11')?.value||'';if(v.length<12){info('Operator paroli kamida 12 belgidan iborat bo‘lsin.','error');return}const fn=state.db.user.needsPassword?'miniOperatorSetPasswordV11':'miniOperatorLoginV11';try{await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e?.message||String(e))))[fn](initData||miniSession,v));await load();info('Operator sifatida kirdingiz. Endi Prixod kiritishingiz mumkin.')}catch(e){info(e.message,'error')}}
async function submitReceipt(){const input=$('#lines');const txt=input?.value.trim();if(!txt){info('Mahsulotlar ro‘yxatini kiriting.','error');return}const btn=$('#submit');if(btn)btn.disabled=true;try{let r=await api('miniReceiptV10',txt,state.page==='undo'?'undo':'add',false);if(r.confirm){if(!confirm('Rejadan ortiq kirim. Baribir saqlaysizmi?\n'+r.message))return;r=await api('miniReceiptV10',txt,'add',true)}if(!r.ok)throw Error(r.error||'Saqlash amalga oshmadi');await load();info(r.message||'Saqlandi');try{tg?.HapticFeedback?.notificationOccurred('success')}catch(_e){}}catch(e){info(e.message,'error')}finally{if(btn)btn.disabled=false}}
async function sendReport(){state.reportProject=$('#reportProject')?.value||state.reportProject;state.notice='Excel hisobot yuborilmoqda…';render();try{const r=await api('miniReportV10',state.reportKind,state.reportProject);info(r)}catch(e){info(e.message,'error')}}
async function sendPlan(){try{await api('miniPlanPromptV10');info('Bot chatida Excel faylni yuborishingiz mumkin.');setTimeout(()=>{try{tg?.close()}catch(_e){}},900)}catch(e){info(e.message,'error')}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-page],[data-action],#retry,#refresh');if(!el)return;if(el.id==='refresh'||el.id==='retry'){load();return}if(el.dataset.page){setPage(el.dataset.page);return}const a=el.dataset.action;switch(a){case 'quick':state.reportKind=el.dataset.kind;setPage(el.dataset.pageNext);break;case 'to-report':state.reportKind=el.dataset.kind;setPage('reports');break;case 'expand':{const p=el.dataset.project;state.openProjects.has(p)?state.openProjects.delete(p):state.openProjects.add(p);render();break}case 'open-detail':state.detailProject=el.dataset.project;state.detailTab='plan';setPage('project');break;case 'tab-detail':state.detailTab=el.dataset.tab;render();break;case 'daily-expand':state.dailyOpen.has(el.dataset.date)?state.dailyOpen.delete(el.dataset.date):state.dailyOpen.add(el.dataset.date);render();break;case 'kind':state.reportKind=el.dataset.kind;render();break;case 'receipt':submitReceipt();break;case 'report':sendReport();break;case 'plan':sendPlan();break;case 'operator-auth':operatorLogin();break;case 'password-change':changeProfilePassword();break;case 'operator-logout':{if(!(initData||miniSession))return;google.script.run.withSuccessHandler(()=>load()).withFailureHandler(x=>info(x?.message||String(x),'error')).miniOperatorLogoutV11(initData||miniSession);break}}});
